<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <!-- ربط ملف الـ Manifest الخارجي بشكل مباشر وصحيح -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0E1117">
  
  <!-- Chart.js & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #1E40AF;
      --accent: #EA580C;
      --gray-text: #9ca3af;
      --bg-main: #0E1117;
      --card-bg: #1E293B;
      --border-color: #334155;
      --text-color: #ffffff;
    }

    body.light-mode {
      --primary: #2563eb;
      --accent: #ea580c;
      --gray-text: #4b5563;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #0f172a;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-main); color: var(--text-color); margin: 0; padding: 0; min-height: 100vh; }

    /* Header & Buttons */
    .app-header { 
      background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; 
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .btn-icon {
      background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-color);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
    }
    .dashboard-card {
      background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .btn-action {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; width: 100%;
    }
    .btn-action:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- 1️⃣ صفحة الغلاف (Splash Screen) -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <div class="flex-1 flex items-center justify-center p-4 w-full max-w-sm">
      <img src="1000230635.png" alt="Splash Icon" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl animate-pulse"/>
    </div>
    
    <div class="pb-10 flex flex-col items-center gap-5">
      <div class="px-5 py-1.5 bg-[#1E293B] rounded-full text-xs text-blue-400 border border-gray-700/60 font-semibold shadow-inner">
        v1.0 - 2026
      </div>
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- حاوية التطبيق SPA -->
  <div id="app"></div>

  <script>
    let currentPage = 'login'; // بدأت بصفحة الدخول افتراضياً
    let currentLang = 'ar';
    let currentRole = 'admin';
    let mainChart = null;
    let statsChart = null;
    let defectImageData = null;

    // 🟢 رابط Google Apps Script المحدث
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVT9uoIJW0w_yxzpBFqFQzw2x_I2eualJzISuIqWbqtihCynohXaasyMOMcyFvXFE/exec";

    window.onload = () => {
      // التحقق مما إذا كان المستخدم قد سجل دخوله مسبقاً
      const savedUser = localStorage.getItem('user');
      if (savedUser) {
        try {
          const userObj = JSON.parse(savedUser);
          if (userObj && userObj.role) {
            currentRole = userObj.role;
          }
        } catch(e) {}
        currentPage = 'home';
      }

      render();
      
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if(splash) {
          splash.style.opacity = '0';
          setTimeout(() => {
            splash.style.display = 'none';
          }, 700);
        }
      }, 2000);
    };

    const translations = {
      ar: {
        dir: 'rtl', langBtn: 'EN', welcome: 'أهلاً:', today: 'اليوم',
        dashTitle: '📊 لوحة المتابعة', openTickets: 'بلاغات مفتوحة', pmLate: 'PM متأخرة', todayDefects: 'عيوب اليوم',
        secMaint: '🛠️ قسم الصيانة والمهام',
        m1: 'تسجيل بلاغ', m2: 'تسجيل PM', m3: 'سجل الصيانة', m4: 'الجدولة', m5: 'مسح QR الماكينات',
        secDefects: '📦 قسم تحليل عيوب الإنتاج',
        d1: 'تصوير عيب', d2: 'فحص AI', d3: 'قاعدة المعرفة', d4: 'الإحصائيات', d5: 'تصدير التقارير',
        secUsers: '👥 إدارة المستخدمين', u1: 'إدارة الصلاحيات والمستخدمين (للمدير فقط)',
        contact: 'تواصل مع الدعم الفني والتطوير', logout: 'تسجيل الخروج ➔', copy: '© 2026 جميع الحقوق محفوظة | Mohamed Hassan',
        chartLabel: 'أكثر الماكينات أعطالاً'
      },
      en: {
        dir: 'ltr', langBtn: 'عربي', welcome: 'Welcome:', today: 'Today',
        dashTitle: '📊 Dashboard Overview', openTickets: 'Open Tickets', pmLate: 'Overdue PM', todayDefects: 'Today Defects',
        secMaint: '🛠️ Maintenance & Tasks',
        m1: 'New Ticket', m2: 'Record PM', m3: 'Maint. Log', m4: 'Schedule', m5: 'Scan Machine QR',
        secDefects: '📦 Defects Analysis',
        d1: 'Capture Defect', d2: 'AI Inspect', d3: 'Knowledge Base', d4: 'Statistics', d5: 'Export Reports',
        secUsers: '👥 Users Management', u1: 'Manage Roles & Users (Admin Only)',
        contact: 'Contact Technical Support', logout: 'Logout ➔', copy: '© 2026 All Rights Reserved | Mohamed Hussein',
        chartLabel: 'Top Faulty Machines'
      }
    };

    const navigateTo = (page) => {
      currentPage = page;
      render();
      window.scrollTo(0,0);
    };

    const toggleLanguage = () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.getElementById('html-tag').dir = translations[currentLang].dir;
      render();
    };

    const toggleDarkMode = () => {
      document.body.classList.toggle('light-mode');
      if(currentPage === 'home') initMainChart();
      if(currentPage === 'stats') initStatsChart();
    };

    const changeRole = (role) => {
      currentRole = role;
      render();
    };

    const render = () => {
      const app = document.getElementById('app');
      if (currentPage === 'login') {
        app.innerHTML = LoginView();
      } else if (currentPage === 'home') {
        app.innerHTML = HomeView();
        initMainChart();
      } else if (currentPage === 'report') {
        app.innerHTML = FormPage('🚨 تسجيل بلاغ عطل جديد', ReportFormFields(), 'تم إرسال البلاغ بنجاح #1024 ✅');
      } else if (currentPage === 'pm') {
        app.innerHTML = FormPage('📝 تسجيل صيانة وقائية (PM)', PMFormFields(), 'تم حفظ نموذج PM بنجاح ✅');
      } else if (currentPage === 'defect') {
        app.innerHTML = DefectView();
      } else if (currentPage === 'log') {
        app.innerHTML = PageView('📋 سجل الصيانة والبلاغات', LogContent());
      } else if (currentPage === 'schedule') {
        app.innerHTML = PageView('📅 جدولة الصيانة', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center text-xs text-gray-400">📅 لا يوجد خطط صيانة متأخرة للأسبوع الحالي.</div>');
      } else if (currentPage === 'qr') {
        app.innerHTML = PageView('📱 مسح QR الماكينات', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">وجه الكاميرا نحو رمز QR الماكينة</p><input type="file" accept="image/*" capture="camera" class="w-full text-xs"></div>');
      } else if (currentPage === 'ai') {
        app.innerHTML = PageView('🤖 فحص العيوب بـ AI', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">ارفع صورة المنتجات لفحصها تلقائياً</p><input type="file" class="w-full text-xs mb-3"><button onclick="alert(\'جاري الفحص... العيب المكتشف: خدش دهان (دقة 94%)\')" class="w-full p-2.5 bg-blue-600 rounded-lg font-bold text-xs text-white">ابدأ الفحص 🚀</button></div>');
      } else if (currentPage === 'stats') {
        app.innerHTML = PageView('📊 الإحصائيات وتحليل الأعطال', '<div class="bg-[#1E293B] p-4 rounded-xl border border-gray-800"><div style="height: 220px;"><canvas id="statsChart"></canvas></div></div>');
        initStatsChart();
      } else if (currentPage === 'kb') {
        app.innerHTML = PageView('📚 قاعدة المعرفة للحلول', '<input placeholder="🔍 ابحث عن العيب أو طريقة الإصلاح..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs mb-3 text-white">');
      } else if (currentPage === 'reports') {
        app.innerHTML = PageView('📄 تصدير التقارير', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 space-y-3"><button onclick="alert(\'تم تصدير ملف Excel بنجاح!\')" class="w-full p-3 bg-green-600 rounded-lg font-bold text-xs text-white">تصدير سجلات الصيانة (Excel) 📊</button></div>');
      } else if (currentPage === 'users') {
        app.innerHTML = PageView('👥 إدارة المستخدمين والصلاحيات', '<div class="bg-[#1E293B] p-4 rounded-xl border border-gray-800 text-xs space-y-2"><div class="flex justify-between items-center border-b border-gray-700 pb-2"><span>محمد حسن (مدير)</span><span class="text-blue-400">Admin</span></div><div class="flex justify-between items-center"><span>أحمد علي (فني)</span><span class="text-gray-400">Technician</span></div></div>');
      }
    };

    // واجهة تسجيل الدخول
    const LoginView = () => `
      <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl p-6 shadow-2xl space-y-4">
          <div class="flex justify-center mb-2">
            <img src="1000230635.png" alt="Logo" class="w-20 h-20 object-contain rounded-2xl shadow-lg"/>
          </div>
          <h2 class="text-xl font-bold text-center text-blue-400">تسجيل دخول النظام</h2>
          <div>
            <label class="block text-xs font-bold mb-1 opacity-70">رقم الموبايل</label>
            <input id="loginPhone" type="tel" placeholder="رقم الموبايل" class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white text-sm focus:outline-none focus:border-blue-500"/>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 opacity-70">كلمة السر</label>
            <input id="loginPass" type="password" placeholder="كلمة السر" class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white text-sm focus:outline-none focus:border-blue-500"/>
          </div>
          <button id="loginBtn" onclick="doLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl font-bold text-sm text-white transition shadow-lg">دخول</button>
        </div>
      </div>
    `;

    // 🟢 دالة تسجيل الدخول المحدثة للربط مع Apps Script
    async function doLogin() {
      const phone = document.getElementById("loginPhone").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const btn = document.getElementById("loginBtn");

      if (!phone || !pass) {
        alert("أدخل رقم الموبايل وكلمة السر");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "جاري تسجيل الدخول...";

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "login",
            phone: phone,
            password: pass
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          localStorage.setItem("user", JSON.stringify(result));
          currentRole = result.role || "tech";
          navigateTo("home");
        } else {
          alert(result.message || "بيانات الدخول غير صحيحة");
        }

      } catch (e) {
        alert("خطأ في الاتصال بالسيرفر");
      }

      btn.disabled = false;
      btn.innerHTML = "دخول";
    }

    // دالة تسجيل الخروج ومسح الجلسة
    const logout = () => {
      localStorage.removeItem('user');
      currentRole = 'admin';
      navigateTo('login');
    };

    // 🟢 واجهة الرئيسية المحدثة بعرض بيانات المستخدم الديناميكية
    const HomeView = () => {
      const t = translations[currentLang];

      return `
      <div class="app-header">
        <div class="text-xs font-bold flex items-center gap-2">
          <img src="1000230635.png" class="w-6 h-6 object-contain rounded"/>
          ${(() => {
             const user = JSON.parse(localStorage.getItem("user") || "{}");
             return `
             <span>
                👋 ${t.welcome}
                ${user.name || "مستخدم"}
                <span class="font-normal opacity-70">
                (${user.job || ""})
                </span>
             </span>`;
          })()}
        </div>
        <div class="flex gap-1.5 items-center">
          <select class="btn-icon" onchange="changeRole(this.value)">
            <option value="admin" ${currentRole==='admin'?'selected':''}>👨‍💼 ${currentLang==='ar'?'مدير':'Admin'}</option>
            <option value="engineer" ${currentRole==='engineer'?'selected':''}>👷‍♂️ ${currentLang==='ar'?'مهندس':'Eng'}</option>
            <option value="tech" ${currentRole==='tech'?'selected':''}>🔧 ${currentLang==='ar'?'فني':'Tech'}</option>
          </select>
          <button class="btn-icon" onclick="toggleLanguage()">${t.langBtn}</button>
          <button class="btn-icon" onclick="toggleDarkMode()">🌙</button>
        </div>
      </div>

      <div class="p-4 max-w-md mx-auto">
        <div class="dashboard-card">
          <div class="flex justify-between items-center text-xs font-bold mb-3">
            <span>${t.dashTitle}</span>
            <span class="opacity-60">${t.today}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center mb-3">
            <div class="bg-[#0E1117] p-2 rounded-lg border border-gray-800">
              <div class="text-lg font-bold text-orange-500">3</div>
              <div class="text-[10px] opacity-70">${t.openTickets}</div>
            </div>
            <div class="bg-[#0E1117] p-2 rounded-lg border border-gray-800">
              <div class="text-lg font-bold text-red-500">5</div>
              <div class="text-[10px] opacity-70">${t.pmLate}</div>
            </div>
            <div class="bg-[#0E1117] p-2 rounded-lg border border-gray-800">
              <div class="text-lg font-bold text-blue-500">12</div>
              <div class="text-[10px] opacity-70">${t.todayDefects}</div>
            </div>
          </div>
          <div style="height: 130px;">
            <canvas id="chartMachines"></canvas>
          </div>
        </div>

        <div class="text-xs font-bold text-blue-400 mb-2">${t.secMaint}</div>
        <div class="grid grid-cols-2 gap-2.5 mb-4">
          ${ActionBtn('🚨', t.m1, 'report')}
          ${ActionBtn('📝', t.m2, 'pm')}
          ${ActionBtn('📋', t.m3, 'log')}
          ${ActionBtn('🗓️', t.m4, 'schedule')}
          <div class="col-span-2">${ActionBtn('📱', t.m5, 'qr')}</div>
        </div>

        <div class="text-xs font-bold text-blue-400 mb-2">${t.secDefects}</div>
        <div class="grid grid-cols-2 gap-2.5 mb-4">
          ${ActionBtn('📷', t.d1, 'defect')}
          ${ActionBtn('🤖', t.d2, 'ai')}
          ${ActionBtn('📚', t.d3, 'kb')}
          ${ActionBtn('📊', t.d4, 'stats')}
          <div class="col-span-2">${ActionBtn('📄', t.d5, 'reports')}</div>
        </div>

        ${currentRole === 'admin' ? `
          <div class="text-xs font-bold text-blue-400 mb-2">${t.secUsers}</div>
          ${ActionBtn('⚙️', t.u1, 'users')}
        ` : ''}
      </div>

      <footer class="text-center p-4 text-[11px] opacity-60 border-t border-gray-800 mt-6">
        <div>${t.contact}</div>
        <button onclick="logout()" class="w-full py-2 bg-red-600 hover:bg-red-700 active:scale-95 rounded-lg font-bold text-xs text-white transition my-2">
          ${t.logout}
        </button>
        <div>${t.copy}</div>
      </footer>
      `;
    };

    const ActionBtn = (icon, text, target) => `
      <div class="btn-action" onclick="navigateTo('${target}')">
        <span class="text-xl">${icon}</span>
        <span class="text-xs font-bold">${text}</span>
      </div>
    `;

    const PageView = (title, content) => `
      <div class="p-4 max-w-md mx-auto">
        <button onclick="navigateTo('home')" class="mb-4 bg-gray-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold">⬅️ ${currentLang==='ar'?'رجوع للرئيسية':'Back Home'}</button>
        <h2 class="text-base font-bold mb-4 text-blue-400">${title}</h2>
        ${content}
      </div>
    `;

    const FormPage = (title, fields, successMsg) => PageView(title, `
      <form onsubmit="alert('${successMsg}'); navigateTo('home'); return false;" class="space-y-4">
        ${fields}
        <button type="submit" class="w-full p-3 bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl font-bold text-xs text-white transition">حفظ وإرسال ✅</button>
      </form>
    `);

    // واجهة تسجيل العيوب
    const DefectView = () => `
    <div class="p-4 max-w-md mx-auto space-y-4 text-white text-right">
      <div class="flex items-center justify-between">
        <button onclick="navigateTo('home')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 active:scale-95 rounded-lg text-xs font-bold transition">
          ⬅️ رجوع للرئيسية
        </button>
        <h2 class="text-sm font-bold text-blue-400">📸 تصوير وتسجيل عيب جديد</h2>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-gray-300">خط الإنتاج</label>
        <select id="lineSelect" class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs text-white focus:outline-none focus:border-blue-500">
          <option value="خط 1">خط 1</option>
          <option value="خط 2">خط 2</option>
          <option value="خط 3">خط 3</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-gray-300">صورة العيب</label>
        <div id="previewBox" class="relative w-full h-44 rounded-xl bg-[#1E293B] border-2 border-dashed border-blue-500/50 flex items-center justify-center overflow-hidden mb-2.5">
          <img id="preview" src="" class="hidden w-full h-full object-cover"/>
          <div id="uploadText" class="text-center text-gray-400">
            <div class="text-3xl mb-1">🖼️</div>
            <p class="text-xs">لم يتم اختيار صورة بعد</p>
          </div>
          <button id="removeImgBtn" type="button" onclick="removeSelectedImage()" class="hidden absolute top-2 left-2 bg-red-600/80 text-white text-[10px] px-2 py-1 rounded-md font-bold backdrop-blur-sm">
            ❌ إزالة
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="document.getElementById('galleryInput').click()" class="py-2.5 bg-gray-800 hover:bg-gray-700 active:scale-95 rounded-lg text-xs font-bold transition">
            🖼️ من الاستوديو
          </button>
          <button type="button" onclick="document.getElementById('cameraInput').click()" class="py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-lg text-xs font-bold transition">
            📷 فتح الكاميرا
          </button>
        </div>
        
        <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleDefectFile(event)"/>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleDefectFile(event)"/>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-gray-300">اسم العيب</label>
        <input id="defectName" type="text" placeholder="مثال: خدش، ثقب، بقعة زيت" class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs text-white focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-gray-300">مكان حدوث العيب</label>
        <input id="defectLocation" type="text" placeholder="مثال: بعد الماكينة 3، الجانب الأيمن" class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs text-white focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1 text-gray-300">وصف العيب والحل المقترح</label>
        <textarea id="defectDesc" rows="3" placeholder="اوصف العيب بالتفصيل... والحل الذي تم اتخاذه" class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <button id="submitBtn" type="button" onclick="saveDefectData()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 active:scale-95 rounded-xl font-bold text-xs text-white shadow-lg transition">
        ✅ حفظ وإرسال
      </button>
    </div>
    `;

    const ReportFormFields = () => `
      <div>
        <label class="block text-xs font-bold mb-1 opacity-70">المعدة / الماكينة</label>

    // ===== لوجستيات رفع الصور والربط بـ Google Sheets =====
    function handleDefectFile(e) {
      const file = e.target.files[0];
      if (file) {
        compressImage(file, 800, 0.7, (compressedBase64) => {
          defectImageData = compressedBase64;
          document.getElementById('preview').src = defectImageData;
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('uploadText').classList.add('hidden');
          document.getElementById('removeImgBtn').classList.remove('hidden');
        });
      }
    }

    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
      };
    }

    function removeSelectedImage() {
      defectImageData = null;
      document.getElementById('preview').src = '';
      document.getElementById('preview').classList.add('hidden');
      document.getElementById('uploadText').classList.remove('hidden');
      document.getElementById('removeImgBtn').classList.add('hidden');
      document.getElementById('galleryInput').value = '';
      document.getElementById('cameraInput').value = '';
    }

    async function saveDefectData() {
      const line = document.getElementById('lineSelect').value;
      const name = document.getElementById('defectName').value.trim();
      const location = document.getElementById('defectLocation').value.trim();
      const description = document.getElementById('defectDesc').value.trim();

      if (!defectImageData) { alert('⚠️ حط صورة'); return; }
      if (!name) { alert('⚠️ اكتب اسم العيب'); return; }

      const user = JSON.parse(localStorage.getItem('user') || '{}');

      const payload = {
        action: "saveDefect",
        user: { name: user.name || "غير محدد", phone: user.phone || "", job: user.job || "", role: currentRole },
        line: line, name: name, location: location, description: description,
        image: defectImageData, date: new Date().toLocaleString('ar-EG')
      };

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.status === 'success') {
          alert('✅ تم الحفظ بنجاح');
          navigateTo('home');
        } else {
          alert('❌ حدث خطأ أثناء الحفظ: ' + (result.message || 'خطأ غير معروف'));
        }
      } catch (error) {
        alert('❌ خطأ: ' + error.message);
      }
    }

    // تسجيل الـ Service Worker الخارجي
    if ('serviceWorker' in navigator) {
