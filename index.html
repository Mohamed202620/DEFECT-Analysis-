<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الصيانة وتحليل العيوب</title>
  <meta name="theme-color" content="#1E40AF">
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // Service Worker داخل نفس الملف
    if('serviceWorker' in navigator){
      const swCode = `
        const CACHE = 'maintenance-v1';
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.add('/'))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], {type: 'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    // Manifest داخل نفس الملف
    const manifest = {
      "name": "نظام الصيانة وتحليل العيوب",
      "short_name": "صيانة",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#0E1117",
      "theme_color": "#1E40AF",
      "lang": "ar",
      "icons": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==", "sizes": "192x192", "type": "image/png"}]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.write(`<link rel="manifest" href="${manifestURL}">`);
  </script>
</head>
<body class="bg-[#0E1117] text-white min-h-screen">
  <div id="app"></div>

<script>
let page = 'home';
const app = document.getElementById('app');

const render = () => {
  if(page === 'home') app.innerHTML = Home();
  if(page === 'report') app.innerHTML = ReportForm();
  if(page === 'pm') app.innerHTML = PMForm();
  if(page === 'log') app.innerHTML = LogPage();
  if(page === 'schedule') app.innerHTML = SchedulePage();
  if(page === 'qr') app.innerHTML = QRPage();
  if(page === 'defect') app.innerHTML = DefectForm();
  if(page === 'ai') app.innerHTML = AIPage();
  if(page === 'stats') { app.innerHTML = StatsPage(); initChart(); }
  if(page === 'kb') app.innerHTML = KBPage();
  if(page === 'reports') app.innerHTML = ReportsPage();
  if(page === 'users') app.innerHTML = UsersPage();
}

// ===== الشاشة الرئيسية =====
const Home = () => `
<header class="flex justify-between items-center p-4 bg-[#1E293B] sticky top-0 z-50 border-b border-gray-800">
  <div>👋 أهلاً: <b>محمد حسن</b> <br><span class="text-xs text-gray-400">(مدير / مهندس جودة)</span></div>
  <div class="flex gap-2">
    <button onclick="document.body.classList.toggle('bg-white')" class="px-2 py-1 bg-gray-800 rounded">🌙</button>
    <button class="px-2 py-1 border border-gray-700 rounded text-xs font-bold">EN</button>
    <select class="bg-gray-800 rounded p-1 text-xs border border-gray-700">
      <option>مدير</option>
      <option>مهندس</option>
      <option>فني</option>
    </select>
  </div>
</header>

<div class="p-4 max-w-md mx-auto">
  <h2 class="mb-2 text-base font-bold text-blue-400">📊 لوحة المتابعة</h2>
  <div class="grid grid-cols-3 gap-2 mb-6">
    ${Card('12','عيوب اليوم','text-blue-400')}
    ${Card('5','PM متأخرة','text-red-400')}
    ${Card('3','بلاغات مفتوحة','text-orange-400')}
  </div>

  <h2 class="mb-2 text-base font-bold text-blue-400 flex items-center gap-1">🛠️ قسم الصيانة والمهام</h2>
  <div class="grid grid-cols-2 gap-3 mb-3">
    ${Btn('🚨','تسجيل بلاغ','report')}
    ${Btn('📝','تسجيل PM','pm')}
    ${Btn('📋','سجل الصيانة','log')}
    ${Btn('📅','الجدولة','schedule')}
  </div>
  ${Btn('📱','مسح QR الماكينات','qr',true)}

  <h2 class="mt-6 mb-2 text-base font-bold text-blue-400 flex items-center gap-1">📦 قسم تحليل عيوب الإنتاج</h2>
  <div class="grid grid-cols-2 gap-3 mb-3">
    ${Btn('📸','تصوير عيب','defect')}
    ${Btn('🤖','فحص AI','ai')}
    ${Btn('📚','قاعدة المعرفة','kb')}
    ${Btn('📊','الإحصائيات','stats')}
  </div>
  ${Btn('📄','تصدير التقارير','reports',true)}

  <div class="mt-6">
    ${Btn('👥','إدارة المستخدمين والصلاحيات (للمدير فقط)','users',true)}
  </div>
</div>
<footer class="text-center p-4 text-gray-400 text-xs border-t border-gray-800 mt-6">
  تواصل مع الدعم الفني والتطوير <br> © 2026 جميع الحقوق محفوظة | Mohamed Hassan
</footer>
`;

const Card = (val, title, color) => `
<div class="bg-[#1E293B] p-3 rounded-xl text-center border border-gray-800 shadow-sm">
  <div class="text-2xl font-bold ${color}">${val}</div>
  <div class="text-xs text-gray-400 mt-1">${title}</div>
</div>`;

const Btn = (icon, text, target, full=false) => `
<button onclick="page='${target}'; render()"
class="bg-[#1E293B] hover:bg-[#334155] active:scale-95 p-3 rounded-xl transition border border-gray-800 flex flex-col items-center justify-center gap-1 ${full?'w-full col-span-2':''}">
  <div class="text-xl">${icon}</div>
  <div class="text-xs font-bold text-gray-200">${text}</div>
</button>`;

// ===== الاستمارات =====
const FormPage = (title, fields, successMsg) => `
<div class="p-4 max-w-md mx-auto">
  <button onclick="page='home'; render()" class="mb-4 bg-gray-800 px-3 py-1.5 rounded-lg text-sm font-bold">⬅️ رجوع للرئيسية</button>
  <h2 class="text-lg font-bold mb-4 text-blue-400">${title}</h2>
  <form onsubmit="alert('${successMsg}'); page='home'; render(); return false" class="space-y-4">
    ${fields}
    <button class="w-full p-3 bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl font-bold text-sm transition">حفظ وإرسال ✅</button>
  </form>
</div>`;

const ReportForm = () => FormPage('🚨 تسجيل بلاغ عطل جديد', `
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">المعدة / الماكينة</label>
    <select class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm" required>
      <option value="">اختر الماكينة...</option>
      <option>ماكينة 2</option>
      <option>خط الدهان 1</option>
      <option>مكبس 4</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">نوع العطل</label>
    <select class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm">
      <option>ميكانيكي</option>
      <option>كهربائي</option>
      <option>برمجي / كنترول</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">وصف العطل</label>
    <textarea placeholder="أدخل تفاصيل العطل والملاحظات..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm h-24" required></textarea>
  </div>
`, 'تم إرسال البلاغ بنجاح #1024 ✅');

const PMForm = () => FormPage('📝 تسجيل صيانة وقائية (PM)', `
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">اسم الماكينة</label>
    <select class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm">
      <option>خط الدهان 1</option>
      <option>ماكينة 2</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-2">قائمة الفحص والتأكيد</label>
    <div class="bg-[#1E293B] p-3 rounded-lg border border-gray-700 space-y-2 text-xs">
      <label class="flex items-center gap-2"><input type="checkbox" required> فحص ضغط الهيدروليك</label>
      <label class="flex items-center gap-2"><input type="checkbox" required> تنظيف الفلاتر ونظام التبريد</label>
      <label class="flex items-center gap-2"><input type="checkbox" required> التشحيم والتزييت الدوري</label>
    </div>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">ملاحظات الفني</label>
    <textarea placeholder="ملاحظات إضافية..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm h-20"></textarea>
  </div>
`, 'تم حفظ نموذج الصيانة الوقائية ✅');

const DefectForm = () => FormPage('📸 تصوير وتسجيل عيب إنتاج', `
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">خط الإنتاج</label>
    <select class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm"><option>خط 1</option><option>خط 2</option></select>
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">صورة العيب</label>
    <input type="file" accept="image/*" capture="camera" class="w-full p-2 bg-[#1E293B] border border-gray-700 rounded-lg text-xs">
  </div>
  <div>
    <label class="block text-xs font-bold text-gray-400 mb-1">ملاحظات العيب</label>
    <textarea placeholder="وصف العيب الظاهري..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-sm h-20"></textarea>
  </div>
`, 'تم حفظ العيب وتحليله بنجاح ✅');

// ===== الشاشات الفرعية =====
const Page = (title, content) => `
<div class="p-4 max-w-md mx-auto">
  <button onclick="page='home'; render()" class="mb-4 bg-gray-800 px-3 py-1.5 rounded-lg text-sm font-bold">⬅️ رجوع للرئيسية</button>
  <h2 class="text-lg font-bold mb-4 text-blue-400">${title}</h2>
  ${content}
</div>`;

const LogPage = () => Page('📋 سجل الصيانة والبلاغات', `
  <div class="overflow-x-auto rounded-xl border border-gray-800">
    <table class="w-full text-xs text-right">
      <tr class="bg-[#1E293B] text-gray-400 border-b border-gray-800"><th class="p-2.5">الكود</th><th class="p-2.5">المعدة</th><th class="p-2.5">الحالة</th></tr>
      <tr class="border-b border-gray-800/50"><td class="p-2.5 font-mono">#1024</td><td class="p-2.5">ماكينة 2</td><td class="p-2.5 text-orange-400 font-bold">مفتوح 🟡</td></tr>
      <tr class="border-b border-gray-800/50"><td class="p-2.5 font-mono">#1023</td><td class="p-2.5">خط الدهان 1</td><td class="p-2.5 text-green-400 font-bold">تم الإصلاح 🟢</td></tr>
      <tr><td class="p-2.5 font-mono">#1022</td><td class="p-2.5">مكبس 4</td><td class="p-2.5 text-green-400 font-bold">تم الإصلاح 🟢</td></tr>
    </table>
  </div>
`);

const StatsPage = () => Page('📊 الإحصائيات وتحليل الأعطال', `
  <div class="bg-[#1E293B] p-4 rounded-xl border border-gray-800">
    <div style="height: 200px;">
      <canvas id="statsChart"></canvas>
    </div>
  </div>
`);

const initChart = () => {
  setTimeout(() => {
    const ctx = document.getElementById('statsChart');
    if(!ctx) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['خدش سطحي', 'فقاعات دهان', 'عدم استواء', 'كسر'],
        datasets: [{
          label: 'عدد الحالات',
          data: [15, 8, 5, 2],
          backgroundColor: ['#3B82F6', '#EF4444', '#F59E0B', '#10B981'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#9CA3AF', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#9CA3AF', font: { size: 10 } }, grid: { color: '#334155' } }
        }
      }
    });
  }, 100);
};

const SchedulePage = () => Page('📅 جدولة الصيانة', `<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center text-xs text-gray-400">📅 لا يوجد خطط صيانة متأخرة للأسبوع الحالي.</div>`);
const QRPage = () => Page('📱 مسح QR الماكينات', `<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">وجه الكاميرا نحو رمز QR الماكينة</p><input type="file" accept="image/*" capture="camera" class="w-full text-xs"></div>`);
const AIPage = () => Page('🤖 فحص العيوب بـ AI', `<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">ارفع صورة المنتجات لفحصها تلقائياً</p><input type="file" class="w-full text-xs mb-3"><button onclick="alert('جاري الفحص... العيب المكتشف: خدش دهان (دقة 94%)')" class="w-full p-2.5 bg-blue-600 rounded-lg font-bold text-xs">ابدأ الفحص 🚀</button></div>`);
const KBPage = () => Page('📚 قاعدة المعرفة للحلول', `<input placeholder="🔍 ابحث عن العيب أو طريقة الإصلاح..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs mb-3">`);
const ReportsPage = () => Page('📄 تصدير التقارير', `<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 space-y-3"><button onclick="alert('تم تصدير ملف Excel بنجاح!')" class="w-full p-3 bg-green-600 rounded-lg font-bold text-xs">تصدير سجلات الصيانة (Excel) 📊</button></div>`);
const UsersPage = () => Page('👥 إدارة المستخدمين والصلاحيات', `<div class="bg-[#1E293B] p-4 rounded-xl border border-gray-800 text-xs space-y-2"><div class="flex justify-between items-center border-b border-gray-700 pb-2"><span>محمد حسن (مدير)</span><span class="text-blue-400">Admin</span></div><div class="flex justify-between items-center"><span>أحمد علي (فني)</span><span class="text-gray-400">Technician</span></div></div>`);

render();
</script>
</body>
</html>
