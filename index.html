<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <!-- ربط ملف الـ Manifest الخارجي بشكل مباشر وصحيح -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0E1117">
  
  <!-- Chart.js & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #1E40AF;
      --accent: #EA580C;
      --gray-text: #9ca3af;
      --bg-main: #0E1117;
      --card-bg: #1E293B;
      --border-color: #334155;
      --text-color: #ffffff;
    }

    body.light-mode {
      --primary: #2563eb;
      --accent: #ea580c;
      --gray-text: #4b5563;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #0f172a;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-main); color: var(--text-color); margin: 0; padding: 0; min-height: 100vh; }

    /* Header & Buttons */
    .app-header { 
      background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; 
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .btn-icon {
      background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-color);
      padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 0.8rem;
    }
    .dashboard-card {
      background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .btn-action {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; width: 100%;
    }
    .btn-action:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- 1️⃣ صفحة الغلاف (Splash Screen) -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <div class="flex-1 flex items-center justify-center p-4 w-full max-w-sm">
      <img src="1000230635.png" alt="Splash Icon" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl animate-pulse"/>
    </div>
    
    <div class="pb-10 flex flex-col items-center gap-5">
      <div class="px-5 py-1.5 bg-[#1E293B] rounded-full text-xs text-blue-400 border border-gray-700/60 font-semibold shadow-inner">
        v1.0 - 2026
      </div>
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- حاوية التطبيق SPA -->
  <div id="app"></div>

  <script>
    let currentPage = 'login'; // بدأت بصفحة الدخول افتراضياً
    let currentLang = 'ar';
    let currentRole = '';
    let mainChart = null;
    let statsChart = null;
    let defectImages = [null, null, null]; // عدد الصور المطلوبة 3 صور
    let usersList = [];
    let pendingUsers = [];
    let dashboardData = {
      total: 0,
      open: 0,
      closed: 0,
      today: 0
    };

    // 🟢 رابط Google Apps Script المحدث
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVT9uoIJW0w_yxzpBFqFQzw2x_I2eualJzISuIqWbqtihCynohXaasyMOMcyFvXFE/exec";

    window.onload = () => {
      // 7️⃣ عند فتح الصفحة: التحقق من وجود جلسة مسجلة
      const phone = localStorage.getItem("phone");
      const savedUser = localStorage.getItem('user');

      if(savedUser){
        try {
          const user = JSON.parse(savedUser);
          if (user && user.role) {
            currentRole = user.role;
          }
        } catch(e) {}
      }

      if (phone || savedUser) {
        currentPage = 'home';
        loadDashboard();
      }

      render();
      
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if(splash) {
          splash.style.opacity = '0';
          setTimeout(() => {
            splash.style.display = 'none';
          }, 700);
        }
      }, 2000);
    };

    const translations = {
      ar: {
        dir: 'rtl', langBtn: 'EN', welcome: 'أهلاً:', today: 'اليوم',
        dashTitle: '📊 لوحة المتابعة', openTickets: 'بلاغات مفتوحة', pmLate: 'PM متأخرة', todayDefects: 'عيوب اليوم',
        secMaint: '🛠️ قسم الصيانة والمهام',
        m1: 'تسجيل بلاغ', m2: 'تسجيل PM', m3: 'سجل الصيانة', m4: 'الجدولة', m5: 'مسح QR الماكينات',
        secDefects: '📦 قسم تحليل عيوب الإنتاج',
        d1: 'تصوير عيب', d2: 'فحص AI', d3: 'قاعدة المعرفة', d4: 'الإحصائيات', d5: 'تصدير التقارير',
        secUsers: '👥 إدارة المستخدمين', u1: 'إدارة الصلاحيات والمستخدمين (للمدير فقط)',
        logout: 'تسجيل الخروج ➔', copy: '© 2026 جميع الحقوق محفوظة | Mohamed Hussein ',
        chartLabel: 'أكثر الماكينات أعطالاً'
      },
      en: {
        dir: 'ltr', langBtn: 'عربي', welcome: 'Welcome:', today: 'Today',
        dashTitle: '📊 Dashboard Overview', openTickets: 'Open Tickets', pmLate: 'Overdue PM', todayDefects: 'Today Defects',
        secMaint: '🛠️ Maintenance & Tasks',
        m1: 'New Ticket', m2: 'Record PM', m3: 'Maint. Log', m4: 'Schedule', m5: 'Scan Machine QR',
        secDefects: '📦 Defects Analysis',
        d1: 'Capture Defect', d2: 'AI Inspect', d3: 'Knowledge Base', d4: 'Statistics', d5: 'Export Reports',
        secUsers: '👥 Users Management', u1: 'Manage Roles & Users (Admin Only)',
        logout: 'Logout ➔', copy: '© 2026 All Rights Reserved | Mohamed Hussein',
        chartLabel: 'Top Faulty Machines'
      }
    };

    const navigateTo = (page) => {
      // الخطوة 7: منع غير المدير من فتح صفحة إدارة المستخدمين أو طلبات التسجيل
      if(page === "users" || page === "requests"){
         if(currentRole !== "admin"){
            alert("ليس لديك صلاحية");
            return;
         }
      }

      currentPage = page;

      if(page === "home"){
         loadDashboard();
      }

      if(page === "users"){
         loadUsers();
      }

      render();
      window.scrollTo(0,0);
    };

    const toggleLanguage = () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.getElementById('html-tag').dir = translations[currentLang].dir;
      render();
    };

    const toggleDarkMode = () => {
      document.body.classList.toggle('light-mode');
      if(currentPage === 'home') initMainChart();
      if(currentPage === 'stats') initStatsChart();
    };

    const render = () => {
      const app = document.getElementById('app');
      if (currentPage === 'login') {
        app.innerHTML = LoginView();
      } else if (currentPage === 'register') {
        app.innerHTML = RegisterView();
      } else if (currentPage === 'home') {
        app.innerHTML = HomeView();
        initMainChart();
      } else if (currentPage === 'report') {
        app.innerHTML = FormPage('🚨 تسجيل بلاغ عطل جديد', ReportFormFields(), 'تم إرسال البلاغ بنجاح #1024 ✅');
      } else if (currentPage === 'pm') {
        app.innerHTML = FormPage('📝 تسجيل صيانة وقائية (PM)', PMFormFields(), 'تم حفظ نموذج PM بنجاح ✅');
      } else if (currentPage === 'defect') {
        app.innerHTML = DefectView();
      } else if (currentPage === 'log') {
        app.innerHTML = PageView('📋 سجل الصيانة والبلاغات', LogContent());
      } else if (currentPage === 'schedule') {
        app.innerHTML = PageView('📅 جدولة الصيانة', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center text-xs text-gray-400">📅 لا يوجد خطط صيانة متأخرة للأسبوع الحالي.</div>');
      } else if (currentPage === 'qr') {
        app.innerHTML = PageView('📱 مسح QR الماكينات', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">وجه الكاميرا نحو رمز QR الماكينة</p><input type="file" accept="image/*" capture="camera" class="w-full text-xs"></div>');
      } else if (currentPage === 'ai') {
        app.innerHTML = PageView('🤖 فحص العيوب بـ AI', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center"><p class="text-xs text-gray-400 mb-3">ارفع صورة المنتجات لفحصها تلقائياً</p><input type="file" class="w-full text-xs mb-3"><button onclick="alert(\'جاري الفحص... العيب المكتشف: خدش دهان (دقة 94%)\')" class="w-full p-2.5 bg-blue-600 rounded-lg font-bold text-xs text-white">ابدأ الفحص 🚀</button></div>');
      } else if (currentPage === 'stats') {
        app.innerHTML = PageView('📊 الإحصائيات وتحليل الأعطال', '<div class="bg-[#1E293B] p-4 rounded-xl border border-gray-800"><div style="height: 220px;"><canvas id="statsChart"></canvas></div></div>');
        initStatsChart();
      } else if (currentPage === 'kb') {
        app.innerHTML = PageView('📚 قاعدة المعرفة للحلول', '<input placeholder="🔍 ابحث عن العيب أو طريقة الإصلاح..." class="w-full p-2.5 rounded-lg bg-[#1E293B] border border-gray-700 text-xs mb-3 text-white">');
      } else if (currentPage === 'reports') {
        app.innerHTML = PageView('📄 تصدير التقارير', '<div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 space-y-3"><button onclick="alert(\'تم تصدير ملف Excel بنجاح!\')" class="w-full p-3 bg-green-600 rounded-lg font-bold text-xs text-white">تصدير سجلات الصيانة (Excel) 📊</button></div>');
      } else if (currentPage === 'requests') {
        app.innerHTML = RequestsView();
        loadPendingUsers();
      } else if (currentPage === 'users') {
        app.innerHTML = PageView(
          "👥 إدارة المستخدمين والصلاحيات",
          `
          <div class="bg-[#1E293B] rounded-xl border border-gray-700 overflow-hidden text-xs">
            ${usersList.length > 0 ? usersList.map(user => `
              <div class="flex justify-between items-center p-3 border-b border-gray-700/60 last:border-b-0">
                <div>
                  <div class="font-bold text-white">${user.name}</div>
                  <div class="text-[11px] text-gray-400 font-mono">${user.phone}</div>
                </div>
                <div class="text-blue-400 font-bold">${user.role}</div>
              </div>
            `).join("") : `<div class="p-4 text-center text-gray-400">جاري تحميل قائمة المستخدمين...</div>`}
          </div>

          ${currentRole == "admin" ? `
          <button
            onclick="deleteUser()"
            class="w-full mt-4 p-3 bg-red-600 hover:bg-red-700 active:scale-95 rounded-lg text-white font-bold transition">
            🗑 حذف مستخدم
          </button>
          ` : ''}
          `
        );
      }
    };

    const LoginView = () => `
      <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl p-6 shadow-2xl space-y-4">
          <div class="flex justify-center mb-2">
            <img src="1000230635.png" alt="Logo" class="w-20 h-20 object-contain rounded-2xl shadow-lg"/>
          </div>
          <h2 class="text-xl font-bold text-center text-blue-400">تسجيل دخول النظام</h2>
          <div>
            <label class="block text-xs font-bold mb-1 opacity-70">رقم الموبايل</label>
            <input id="loginPhone" type="tel" placeholder="رقم الموبايل" class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white text-sm focus:outline-none focus:border-blue-500"/>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 opacity-70">كلمة السر</label>
            <div class="relative">
              <input
                id="loginPass"
                type="password"
                placeholder="كلمة السر"
                class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white text-sm pr-12 focus:outline-none focus:border-blue-500"/>
              <button
                type="button"
                onclick="togglePassword()"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                👁️
              </button>
            </div>
          </div>
          <button id="loginBtn" onclick="doLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl font-bold text-sm text-white transition shadow-lg">دخول</button>

          <div class="flex gap-2 mt-3">
            <button
              onclick="navigateTo('register')"
              class="flex-1 py-2 rounded-lg border border-blue-500 text-blue-400 text-xs">
              مستخدم جديد
            </button>
            <button
              onclick="showLogin()"
              class="flex-1 py-2 rounded-lg border border-gray-600 text-gray-300 text-xs">
              مستخدم حالي
            </button>
          </div>
        </div>
      </div>
    `;

    const RegisterView = () => `
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl p-6 shadow-2xl space-y-4">

        <h2 class="text-xl font-bold text-center text-blue-400">
          إنشاء حساب جديد
        </h2>

        <input id="regName" type="text"
          placeholder="الاسم بالكامل"
          class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white">

        <input id="regPhone" type="tel"
          placeholder="رقم الموبايل"
          class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white">

        <input id="regJob" type="text"
          placeholder="الوظيفة"
          class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white">

        <input id="regPassword" type="password"
          placeholder="كلمة المرور"
          class="w-full p-3 rounded-lg bg-[var(--bg-main)] border border-[var(--border-color)] text-white">

        <button
          onclick="registerUser()"
          class="w-full py-3 bg-blue-600 rounded-xl font-bold text-white">
          إنشاء الحساب
        </button>

        <button
          onclick="navigateTo('login')"
          class="w-full py-3 bg-gray-700 rounded-xl text-white">
          رجوع
        </button>

      </div>
    </div>
    `;

    const RequestsView = () => `
      <div class="p-4 max-w-md mx-auto">
        <button
          onclick="navigateTo('home')"
          class="mb-4 bg-gray-700 text-white px-3 py-2 rounded-lg text-xs font-bold">
          ⬅️ رجوع للرئيسية
        </button>

        <h2 class="text-lg font-bold text-blue-400 mb-4">
          📥 طلبات التسجيل
        </h2>

        <div id="pendingContainer">
          <div class="text-center text-gray-400 text-xs p-4 bg-[#1E293B] rounded-xl border border-gray-800">
            جاري تحميل الطلبات...
          </div>
        </div>
      </div>
    `;

    async function doLogin() {
      const phone = document.getElementById("loginPhone").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const btn = document.getElementById("loginBtn");

      if (!phone || !pass) {
        alert("أدخل رقم الموبايل وكلمة السر");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "⏳ جاري تسجيل الدخول...";

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "login",
            phone: phone,
            password: pass
          })
        });

        const result = await response.json();

        if(result.status == "pending"){
            btn.disabled = false;
            btn.innerHTML = "دخول";
            alert("حسابك مازال في انتظار موافقة المدير.");
            return;
        }

        if(result.status == "disabled"){
            btn.disabled = false;
            btn.innerHTML = "دخول";
            alert("تم إيقاف هذا الحساب.");
            return;
        }

        if(result.status == "rejected"){
            btn.disabled = false;
            btn.innerHTML = "دخول";
            alert("تم رفض طلب التسجيل.");
            return;
        }

        if (result.status === "success") {
          btn.disabled = false;
          btn.innerHTML = "دخول";

          localStorage.setItem("phone", phone);
          localStorage.setItem("name", result.name);
          localStorage.setItem("job", result.job);
          localStorage.setItem("role", result.role);
          localStorage.setItem("user", JSON.stringify(result));

          alert("أهلاً " + result.name);

          // التحديث بالدور المرجح من الداتا بيز
          currentRole = result.role;
          navigateTo("home");
        } else {
          btn.disabled = false;
          btn.innerHTML = "دخول";

          const card = document.querySelector("#loginScreen div");
          if (card) {
            card.animate(
              [
                {transform: "translateX(-8px)"},
                {transform: "translateX(8px)"},
                {transform: "translateX(-8px)"},
                {transform: "translateX(8px)"},
                {transform: "translateX(0px)"}
              ],
              {duration: 300}
            );
          }

          alert(result.message || "بيانات الدخول غير صحيحة");
        }

      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = "دخول";

        const card = document.querySelector("#loginScreen div");
        if (card) {
          card.animate(
            [
              {transform: "translateX(-8px)"},
              {transform: "translateX(8px)"},
              {transform: "translateX(-8px)"},
              {transform: "translateX(8px)"},
              {transform: "translateX(0px)"}
            ],
            {duration: 300}
          );
        }

        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    async function registerUser() {

      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const job = document.getElementById("regJob").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (!name || !phone || !password) {
        alert("يرجى إدخال جميع البيانات المطلوبة");
        return;
      }

      try {

        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "register",
            name: name,
            phone: phone,
            job: job,
            password: password,
            status: "Pending"
          })
        });

        const result = await response.json();

        if (result.status === "success") {

          alert("✅ تم إرسال طلب التسجيل.\n\nسيتم تفعيل الحساب بعد موافقة المدير.");

          document.getElementById("regName").value = "";
          document.getElementById("regPhone").value = "";
          document.getElementById("regJob").value = "";
          document.getElementById("regPassword").value = "";

          showLogin();
          navigateTo("login");

        } else {

          alert(result.message);

        }

      } catch (err) {

        alert("خطأ في الاتصال بالسيرفر");

        console.log(err);

      }

    }

    async function loadPendingUsers(){
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "getPendingUsers"
          })
        });

        const result = await response.json();

        if(result.status == "success"){
          pendingUsers = result.users;

          if(!pendingUsers || pendingUsers.length === 0) {
            document.getElementById("pendingContainer").innerHTML = `
              <div class="bg-[#1E293B] p-6 rounded-xl border border-gray-800 text-center text-xs text-gray-400">
                ✨ لا توجد طلبات تسجيل معلقة حالياً
              </div>`;
            return;
          }

          let html = "";
          pendingUsers.forEach(user => {
            html += `
              <div class="bg-[#1E293B] border border-gray-700/80 rounded-xl p-3 mb-3 text-xs">
                <div class="font-bold text-white text-sm mb-1">${user.name}</div>
                <div class="text-gray-300 mb-0.5">💼 الوظيفة: ${user.job}</div>
                <div class="text-gray-400 font-mono">📱 ${user.phone}</div>

                <div class="grid grid-cols-2 gap-2 mt-3">
                  <button
                    onclick="approveUser('${user.phone}')"
                    class="bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold p-2 rounded-lg transition text-xs">
                    ✅ موافقة
                  </button>

                  <button
                    onclick="rejectUser('${user.phone}')"
                    class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold p-2 rounded-lg transition text-xs">
                    ❌ رفض
                  </button>
                </div>
              </div>
            `;
          });

          document.getElementById("pendingContainer").innerHTML = html;
        } else {
          document.getElementById("pendingContainer").innerHTML = `
            <div class="text-center text-red-400 text-xs p-4">
              خطأ في تحميل البيانات
            </div>`;
        }
      } catch(err) {
        console.log(err);
        document.getElementById("pendingContainer").innerHTML = `
          <div class="text-center text-red-400 text-xs p-4">
            خطأ في الاتصال بالسيرفر
          </div>`;
      }
    }

    async function approveUser(phone){
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "approveUser",
            phone: phone
          })
        });

        loadPendingUsers();
      } catch(err) {
        alert("خطأ في الاتصال بالسيرفر");
      }
    }

    async function rejectUser(phone){
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            action: "rejectUser",

    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
      };
    }

    async function saveDefectData() {
      if(defectImages.includes(null)){
        alert("يرجى رفع ثلاث صور للعيب.");
        return;
      }

      const name = document.getElementById("defectName").value.trim();
      if (!name) {
        alert("⚠️ يرجى إدخال اسم العيب");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = "⏳ جاري الحفظ والإرسال...";

      const line = document.getElementById("lineSelect").value;
      const stage = document.getElementById("stageSelect").value;
      const location = document.getElementById("defectLocation").value.trim();
      const description = document.getElementById("defectDesc").value.trim();

      const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
      const phone = localStorage.getItem("phone") || currentUser.phone || "";
      const userName = localStorage.getItem("name") || currentUser.name || "";
      const job = localStorage.getItem("job") || currentUser.job || "";
      const role = localStorage.getItem("role") || currentUser.role || "";

      const payload = {
        action: "saveDefect",
        user: {
          name: userName,
          phone: phone,
          job: job,
          role: role
        },
        line: line,
        stage: stage,
        name: name,
        location: location,
        description: description,
        image1: defectImages[0],
        image2: defectImages[1],
        image3: defectImages[2],
        date: new Date().toLocaleString('ar-EG')
      };

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.status === 'success') {
          alert('✅ تم الحفظ بنجاح');
          defectImages = [null, null, null];
          navigateTo('home');
        } else {
          btn.disabled = false;
          btn.innerHTML = "✅ حفظ وإرسال";
          alert('❌ حدث خطأ أثناء الحفظ: ' + (result.message || 'خطأ غير معروف'));

      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = "✅ حفظ وإرسال";
        alert('❌ خطأ: ' + error.message);
      }
    }
